<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>AnimeStreamX — Stream Anime Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #07070d;
  --bg2:      #0d0d18;
  --bg3:      #12121f;
  --bg4:      #1a1a2e;
  --border:   #1e1e35;
  --border2:  #2a2a45;
  --accent:   #6c63ff;
  --accent2:  #a78bfa;
  --pink:     #f472b6;
  --green:    #34d399;
  --orange:   #fb923c;
  --teal:     #22d3ee;
  --text:     #e8e8f0;
  --text2:    #9090b0;
  --text3:    #55556a;
  --card-r:   12px;
  --trans:    .2s ease;
}

html { -webkit-text-size-adjust: 100%; }
html, body { width: 100%; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); overflow: hidden; overscroll-behavior: none; }

#root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

#view-home, #view-player { position: absolute; inset: 0; transition: opacity .35s ease, transform .35s ease; }
#view-home   { z-index: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
#view-player { z-index: 2; opacity: 0; pointer-events: none; transform: translateY(20px); display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }
#view-player.active { opacity: 1; pointer-events: all; transform: translateY(0); }
#view-home.hidden { opacity: 0; pointer-events: none; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

#navbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 58px;
  background: rgba(7,7,13,.88);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}

.logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700; font-size: 20px; letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; white-space: nowrap; cursor: pointer; flex-shrink: 0;
}
.logo span { -webkit-text-fill-color: transparent; }

#search-wrap { flex: 1; max-width: 480px; position: relative; }
#search-inp {
  width: 100%; padding: 9px 16px 9px 40px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 24px; color: var(--text); font-size: 14px;
  outline: none; transition: border-color var(--trans), box-shadow var(--trans);
}
#search-inp::placeholder { color: var(--text3); }
#search-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,.15); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }

#search-dropdown {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,.6);
  z-index: 200; display: none;
  max-height: 500px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
#search-dropdown.show { display: block; }
.sd-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; cursor: pointer;
  transition: background var(--trans);
  border-bottom: 1px solid var(--border);
}
.sd-item:last-child { border-bottom: none; }
.sd-item:hover, .sd-item:active { background: var(--bg4); }
.sd-img { width: 36px; height: 50px; object-fit: cover; border-radius: 5px; flex-shrink: 0; background: var(--bg4); }
.sd-info { flex: 1; min-width: 0; }
.sd-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sd-meta  { font-size: 11px; color: var(--text2); margin-top: 2px; }
.sd-score { font-size: 11px; color: #fbbf24; }

.nav-btn {
  padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border2);
  background: transparent; color: var(--text2); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all var(--trans); white-space: nowrap;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn-highlight {
  background: linear-gradient(135deg, rgba(108,99,255,.18), rgba(244,114,182,.12));
  border-color: rgba(108,99,255,.45); color: var(--accent2);
}
.nav-btn-highlight:hover { background: linear-gradient(135deg, rgba(108,99,255,.3), rgba(244,114,182,.2)); border-color: var(--accent); color: #fff; }
#nav-btn-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

#hero {
  position: relative; overflow: hidden;
  min-height: 420px; display: flex; align-items: flex-end;
  padding: 0 32px 40px;
  background: linear-gradient(135deg, #0d0d20 0%, #0a0010 50%, #070710 100%);
}
#hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center top; opacity: 0; transition: opacity 1s ease; filter: blur(0px) saturate(1.1); }
#hero-bg.loaded { opacity: 0.28; }
#hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(7,7,13,.7) 50%, rgba(7,7,13,.3) 100%); }
#hero-content { position: relative; z-index: 2; max-width: 560px; }
.hero-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; background: rgba(108,99,255,.2); border: 1px solid rgba(108,99,255,.35); font-size: 11px; font-weight: 700; color: var(--accent2); letter-spacing: .05em; margin-bottom: 12px; }
#hero-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 4vw, 38px); font-weight: 700; line-height: 1.15; margin-bottom: 8px; letter-spacing: -.02em; }
#hero-desc { font-size: 13.5px; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 18px; max-width: 440px; }
#hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-btn { display: flex; align-items: center; gap: 7px; padding: 10px 22px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all var(--trans); }
.hero-btn-primary { background: var(--accent); color: #fff; }
.hero-btn-primary:hover { background: #5850e0; transform: translateY(-1px); }
.hero-btn-secondary { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border2); }
.hero-btn-secondary:hover { background: rgba(255,255,255,.13); }
.hero-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.hero-tag { padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--bg4); color: var(--text2); }
.hero-score { color: #fbbf24; font-size: 13px; font-weight: 700; }
.hero-ep { color: var(--text2); font-size: 12px; }

.loading-spin { width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin-sm { width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }

.section { padding: 28px 24px 4px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.section-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.section-title .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.see-all { font-size: 12px; color: var(--accent2); font-weight: 600; cursor: pointer; transition: color var(--trans); }
.see-all:hover { color: var(--accent); }

#genre-bar { display: flex; gap: 8px; padding: 0 24px 20px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#genre-bar::-webkit-scrollbar { display: none; }
.genre-pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all var(--trans); flex-shrink: 0; }
.genre-pill:hover, .genre-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.anime-card { cursor: pointer; transition: transform var(--trans); border-radius: var(--card-r); overflow: hidden; }
.anime-card:hover { transform: translateY(-4px); }
.card-poster { position: relative; padding-top: 145%; background: var(--bg3); overflow: hidden; border-radius: var(--card-r); }
.card-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.anime-card:hover .card-poster img { transform: scale(1.06); }
.card-score { position: absolute; top: 7px; left: 7px; background: rgba(0,0,0,.75); backdrop-filter: blur(4px); color: #fbbf24; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; display: flex; align-items: center; gap: 3px; }
.card-type { position: absolute; top: 7px; right: 7px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 5px; letter-spacing: .05em; }
.card-ep-badge { position: absolute; bottom: 7px; right: 7px; background: rgba(0,0,0,.78); backdrop-filter: blur(4px); color: var(--text2); font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
.card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,7,13,.9) 0%, transparent 60%); opacity: 0; transition: opacity .3s; display: flex; align-items: flex-end; padding: 10px; }
.anime-card:hover .card-overlay { opacity: 1; }
.play-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: auto; }
.card-info { padding: 8px 2px 2px; }
.card-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-sub { font-size: 11px; color: var(--text2); margin-top: 3px; }

.h-scroll-wrap { overflow-x: auto; padding: 0 24px 24px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.h-scroll-wrap::-webkit-scrollbar { display: none; }
.h-scroll { display: flex; gap: 14px; }
.h-scroll .anime-card { flex-shrink: 0; width: 140px; }

.skeleton { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-card { height: 200px; border-radius: var(--card-r); }

/* EPISODE PICKER MODAL */
#ep-modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 400;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); padding: 16px;
}
#ep-modal-bg.show { display: flex; }
#ep-modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; width: 100%; max-width: 520px;
  max-height: 85vh; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,.8);
}
#ep-modal-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; position: relative;
}
#ep-modal-poster { width: 48px; height: 68px; object-fit: cover; border-radius: 8px; background: var(--bg4); flex-shrink: 0; }
#ep-modal-info { flex: 1; min-width: 0; }
#ep-modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
#ep-modal-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.em-badge { padding: 2px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: var(--bg4); color: var(--text2); }
#ep-modal-close { background: var(--bg4); border: none; color: var(--text2); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }

#em-lang-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 8px; }
#em-lang-row .label { font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
#em-lang-btns { display: flex; gap: 4px; background: var(--bg3); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
#em-lang-btns button { padding: 4px 12px; border-radius: 7px; border: none; background: transparent; color: var(--text2); font-size: 11px; font-weight: 700; cursor: pointer; transition: all var(--trans); }
#em-lang-btns button.active { background: var(--accent); color: #fff; }

#em-ep-search-wrap { padding: 0 20px 10px; }
#em-ep-search { width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 12px; outline: none; }

#ep-list { padding: 10px 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: 320px; }
.ep-btn { height: 38px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all var(--trans); display: flex; align-items: center; justify-content: center; }
.ep-btn:hover, .ep-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#ep-list-loading { grid-column: 1/-1; display: flex; justify-content: center; padding: 30px 0; }

/* PLAYER VIEW */
#player-topbar { height: 50px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 10; position: sticky; top: 0; }
#back-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; }
#back-btn:hover { border-color: var(--accent); color: #fff; }
#player-show-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
#player-ep-label { font-size: 12px; color: var(--text2); font-weight: 600; }

#player-controls { display: flex; align-items: center; gap: 8px; }
#player-lang-toggle { display: flex; gap: 2px; background: var(--bg3); padding: 2px; border-radius: 8px; border: 1px solid var(--border); }
#player-lang-toggle button { padding: 3px 9px; border-radius: 6px; border: none; background: transparent; color: var(--text2); font-size: 10.5px; font-weight: 700; cursor: pointer; }
#player-lang-toggle button.active { background: var(--accent); color: #fff; }

.ep-nav-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; }
.ep-nav-btn:hover { border-color: var(--accent); color: #fff; }
#ep-picker-btn { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; }

.an-label { font-size: 11px; color: var(--text3); font-weight: 600; }
.switch-sm { position: relative; display: inline-block; width: 28px; height: 16px; }
.switch-sm input { opacity: 0; width: 0; height: 0; }
.slider-sm { position: absolute; cursor: pointer; inset: 0; background-color: var(--bg4); transition: .2s; border-radius: 16px; }
.slider-sm:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .2s; border-radius: 50%; }
input:checked + .slider-sm { background-color: var(--accent); }
input:checked + .slider-sm:before { transform: translateX(12px); }

#srv-panel-btn { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; }
#srv-panel-btn.open { background: var(--accent); color: #fff; border-color: var(--accent); }

#player-main { width: 100%; aspect-ratio: 16/9; max-height: 62vh; position: relative; background: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#player-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #07070d; z-index: 1; }
iframe { width: 100%; height: 100%; border: none; position: absolute; inset: 0; z-index: 2; }

/* SKIP INTRO BAR */
#skip-bar { position: absolute; bottom: 24px; left: 24px; z-index: 10; display: none; gap: 8px; }
#skip-bar.show { display: flex; }
.skip-btn { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.8); backdrop-filter: blur(8px); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s; }
.skip-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
.skip-timer { font-size: 10px; opacity: .7; }

/* AUTO NEXT OVERLAY */
#an-overlay { position: absolute; inset: 0; z-index: 20; background: rgba(7,7,13,.92); backdrop-filter: blur(10px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.an-title { font-size: 13px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
.an-ep { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; }
#an-bar-bg { width: 220px; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; margin: 6px 0 10px; }
#an-bar { height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
.an-actions { display: flex; gap: 10px; }
.an-actions button { padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
#an-play { background: var(--accent); color: #fff; }
#an-cancel { background: var(--bg4); color: var(--text); }

/* INLINE SERVER SELECTOR SECTION BELOW PLAYER */
#player-server-section {
  padding: 20px 24px 40px; background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 14px; flex: 1;
}
.server-sec-header { display: flex; align-items: center; justify-content: space-between; }
.server-sec-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; }
.server-sec-title svg { color: var(--accent); }

/* SERVER FLOATING DROPDOWN PANEL */
#server-dropdown {
  position: absolute; top: 56px; right: 16px; width: 340px;
  background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px;
  padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.8);
  z-index: 100; display: none; flex-direction: column; gap: 10px;
}
#server-dropdown.show { display: flex; }
.sd-sec-title { font-size: 10.5px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; }

#src-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
#src-tabs::-webkit-scrollbar { display: none; }
.src-t { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all var(--trans); }
.src-t.active { background: var(--accent); border-color: var(--accent); color: #fff; }

#srv-loading { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); padding: 8px 0; }
#srv-loading.show { display: flex; }

#hi-subsrc-row { display: none; gap: 6px; flex-wrap: wrap; padding-bottom: 4px; }
#hi-subsrc-row.show { display: flex; }
.subsrc-pill { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; }
.subsrc-pill.active { background: var(--accent2); color: #000; border-color: var(--accent2); }

#qual-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.q-pill { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; }
.q-pill.active { background: var(--green); color: #000; border-color: var(--green); }
.q-pill.unavail { opacity: .4; cursor: not-allowed; }

#srv-list-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; }
.srv-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
.srv-item:hover, .srv-item.active { border-color: var(--accent); background: var(--bg4); }
.srv-badge-sm { font-size: 9.5px; padding: 2px 6px; border-radius: 4px; background: rgba(108,99,255,.2); color: var(--accent2); font-weight: 700; }

// ═══════════════════════════════════════════════════════════
//  MYANIMELIST API ENGINE (With Jikan Fail-Safe Fallback)
// ═══════════════════════════════════════════════════════════
async function malFetch(path, jikanFallbackPath) {
  try {
    const r = await fetch(`https://api.myanimelist.net/v2${path}`, {
      headers: { 'X-MAL-CLIENT-ID': MAL_CLIENT_ID }
    });
    if (r.ok) {
      const data = await r.json();
      return data;
    }
  } catch (e) {
    // CORS or network error, fallback to Jikan v4
  }
  try {
    const r2 = await fetch(`${JIKAN_BASE}${jikanFallbackPath}`);
    if (r2.ok) return await r2.json();
  } catch (_) {}
  return null;
}

function normalizeAnime(item) {
  if (!item) return null;
  const node = item.node || item;
  const malId = node.mal_id || node.id;
  const title = node.title || node.title_english || 'Untitled';
  const imgObj = node.images?.jpg || node.main_picture || {};
  const image_url = imgObj.large_image_url || imgObj.image_url || imgObj.large || imgObj.medium || '';
  const small_img = imgObj.small_image_url || imgObj.medium || image_url;
  const score = node.score || node.mean ? Number(node.score || node.mean).toFixed(1) : null;
  const episodes = node.episodes || node.num_episodes || null;
  const status = node.status || 'Finished Airing';
  const year = node.year || (node.start_season?.year) || (node.aired?.from ? node.aired.from.split('-')[0] : '');
  const synopsis = node.synopsis || '';
  const genres = (node.genres || []).map(g => ({ name: typeof g === 'string' ? g : g.name }));
  const type = node.type || 'TV';

  return {
    mal_id: malId, id: malId,
    title, title_english: node.title_english || title,
    images: { jpg: { image_url: small_img, small_image_url: small_img, large_image_url: image_url } },
    score, type, episodes, status, year, synopsis, genres
  };
}

async function getAiringAnime() {

  const rawList = d?.data || d?.data || [];
  return rawList.map(normalizeAnime).filter(Boolean);
}

function showTitle(a) { return a.title_english || a.title || 'Untitled'; }

// ═══════════════════════════════════════════════════════════
//  ANIMEGG DATA LOADER
// ═══════════════════════════════════════════════════════════
async function loadAnimeGG() {
  if (_animeggCache) return _animeggCache;
  if (_animeggProm)  return _animeggProm;
  _animeggProm = Promise.all(
    ANIMEGG_FILES.map(f => fetch(ANIMEGG_BASE + f).then(r => r.ok ? r.json() : []).catch(() => []))
  ).then(results => {
    _animeggCache = results.flat().filter(Boolean);
    _animeggProm  = null;
    return _animeggCache;
  });
  return _animeggProm;
}

async function fetchAnimeGGEntry(malId) {
  if (!malId) return null;
  const mid = parseInt(malId, 10);
  const all = await loadAnimeGG();
  return all.find(e => parseInt(e.mal_id, 10) === mid) || null;
}

function getAnimeGGUrl(entry, ep, lang) {
  if (!entry?.episodes) return null;
  const epN = parseInt(ep, 10);
  const epObj = entry.episodes.find(e => parseInt(e.ep, 10) === epN);
  if (!epObj) return null;
  return lang === 'sub' ? (epObj.sub || epObj.dub || null) : (epObj.dub || epObj.sub || null);
}

async function loadAniDB() {
  if (_anidbCache) return _anidbCache;
  if (_anidbProm)  return _anidbProm;
  _anidbProm = fetch(ANIDB_URL)
    .then(r => r.ok ? r.json() : [])
    .catch(() => [])
    .then(data => {
      _anidbCache = Array.isArray(data) ? data : [];
      _anidbProm  = null;
      return _anidbCache;
    });
  return _anidbProm;
}

async function fetchAniDBEntry(malId) {
  if (!malId) return null;
  const mid = String(parseInt(malId, 10));
  const all = await loadAniDB();
  return all.find(e => {
    if (!e.mal) return false;
    const m = e.mal.match(/\/anime\/(\d+)/);
    return m && m[1] === mid;
  }) || null;
}

function setAniDBStatus(text, found) {
  const row  = document.getElementById('anidb-status-row');
  const span = document.getElementById('anidb-status-text');
  if (!text) { row.classList.remove('show'); return; }
  span.textContent = text;
  row.classList.add('show');
  row.style.background  = found ? 'rgba(52,211,153,.08)'  : 'rgba(155,155,180,.08)';
  row.style.borderColor = found ? 'rgba(52,211,153,.25)'  : 'rgba(155,155,180,.25)';
  row.style.color       = found ? 'var(--green)'          : 'var(--text2)';
}

async function fetchAniDBForCurrentMedia() {
  if (!playerMalId) return;
  anidbEntry = null;
  setAniDBStatus('Checking AniDB library…', false);
  try {
    const entry = await fetchAniDBEntry(playerMalId);
    anidbEntry = entry;
    if (entry) {
      setAniDBStatus(`✓ Found: Serial #${entry.serial_no}`, true);
      document.getElementById('tab-anidb').style.opacity = '1';
      if (activeSrc === 'anidb') renderAniDBList();
    } else {
      setAniDBStatus('Not in AniDB batch library', false);
    }
  } catch(e) {
    setAniDBStatus('AniDB lookup failed', false);
  }
}

function renderAniDBList() {
  const list = document.getElementById('srv-list-inner');
  const qRow = document.getElementById('qual-row');
  qRow.innerHTML = ''; qRow.style.display = 'none'; list.innerHTML = '';
  document.getElementById('hi-subsrc-row').classList.remove('show');
  document.getElementById('srv-loading').classList.remove('show');

  if (!anidbEntry) {
    list.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:8px 0;line-height:1.6">No AniDB streams for this title.<br><span style="font-size:11px;color:var(--text3)">Try AnisantCH or HiAnime.</span></div>';
    return;
  }

  const epN = parseInt(playerEp, 10);
  const prefer = playerLang;
  const keys = prefer === 'sub'
    ? [`embed_sub_ep_${epN}`, `embed_dub_ep_${epN}`]
    : [`embed_dub_ep_${epN}`, `embed_sub_ep_${epN}`];

  const srvs = [];
  keys.forEach(k => {
    if (anidbEntry[k]) {
      const isDub = k.includes('_dub_');
      srvs.push({
        key: `anidb_${k}`,
        label: isDub ? 'AniDB DUB' : 'AniDB SUB',
        badge: 'AniDB',
        url: anidbEntry[k],
        source: 'anidb',
        lang: isDub ? 'dub' : 'sub'
      });
    }
  });

  if (!srvs.length) {
    list.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No AniDB streams for Episode ${epN}.</div>`;
    return;
  }

  srvs.forEach((srv, i) => {

    btn.className = 'srv-item adb' + (i === 0 ? ' active' : '');

      document.querySelectorAll('.srv-item').forEach(b => b.classList.remove('active'));

      playAniDBSrv(srv);
    };
    list.appendChild(btn);
    if (i === 0) activeServer = srv;
  });

async function loadM4USeries() {
  if (_m4uSeriesCache) return _m4uSeriesCache;
  if (_m4uSeriesProm)  return _m4uSeriesProm;
  _m4uSeriesProm = Promise.all(
    M4U_SERIES_FILES.map(f => fetch(M4U_BASE + f).then(r => r.ok ? r.json() : []).catch(() => []))
  ).then(results => { _m4uSeriesCache = results.flat().filter(Boolean); _m4uSeriesProm = null; return _m4uSeriesCache; });
  return _m4uSeriesProm;
}

async function loadM4UMovies() {
  if (_m4uMoviesCache) return _m4uMoviesCache;
  if (_m4uMoviesProm)  return _m4uMoviesProm;
  _m4uMoviesProm = Promise.all(
    M4U_MOVIES_FILES.map(f => fetch(M4U_BASE + f).then(r => r.ok ? r.json() : []).catch(() => []))
  ).then(results => { _m4uMoviesCache = results.flat().filter(Boolean); _m4uMoviesProm = null; return _m4uMoviesCache; });
  return _m4uMoviesProm;
}

async function loadAnimeList() {
  if (_animeListCache) return _animeListCache;
  if (_animeListProm)  return _animeListProm;
  _animeListProm = fetch(ANIME_LIST_URL)
    .then(r => r.ok ? r.json() : [])
    .then(data => { _animeListCache = Array.isArray(data) ? data : []; _animeListProm = null; return _animeListCache; })
    .catch(() => { _animeListProm = null; return []; });
  return _animeListProm;
}

async function findM4UEntryByMalId(malId) {
  if (!malId) return null;
  const list = await loadAnimeList();
  const mid  = parseInt(malId, 10);
  const mapObj = list.find(e => parseInt(e.mal_id, 10) === mid);
  const tmdbTvId = mapObj?.themoviedb_id?.tv || mapObj?.themoviedb_id?.movie;
  if (tmdbTvId) {
    const sSeries = await loadM4USeries();
    const sMovie  = await loadM4UMovies();
    const foundS = sSeries.find(e => String(e.tmdb_id) === String(tmdbTvId));
    if (foundS) return { entry: foundS, isMovie: false };
    const foundM = sMovie.find(e => String(e.tmdb_id) === String(tmdbTvId));
    if (foundM) return { entry: foundM, isMovie: true };
  }
  return null;
}

async function fetchM4UForCurrentMedia() {
  if (!playerMalId) return;
  m4uSeriesEntry = null; m4uMovieEntry = null;
  try {
    const res = await findM4UEntryByMalId(playerMalId);
    if (res?.entry) {
      if (res.isMovie) m4uMovieEntry = res.entry;
      else m4uSeriesEntry = res.entry;
      setM4UStatus(`✓ Found: ${res.entry.title}`, true);
      document.getElementById('tab-m4u').style.opacity = '1';
      if (activeSrc === 'm4uhd') renderM4UList();
    } else {
      setM4UStatus('Not in M4UHD library', false);
    }
  } catch(e) {
    setM4UStatus('M4UHD lookup failed', false);
  }
}

function setM4UStatus(text, found) {
  const row  = document.getElementById('m4u-status-row');
  const span = document.getElementById('m4u-status-text');
  if (!text) { row.classList.remove('show'); return; }
  span.textContent = text; row.classList.add('show');
  row.style.background  = found ? 'rgba(52,211,153,.08)'  : 'rgba(251,146,60,.08)';
  row.style.borderColor = found ? 'rgba(52,211,153,.25)'  : 'rgba(251,146,60,.25)';
  row.style.color       = found ? 'var(--green)'          : 'var(--orange)';
}

function buildM4USrvs(entry, ep) {
  const srvs = []; const epN = parseInt(ep, 10);
  for (const skey of M4U_ALLOWED_SERVERS) {
    const url = entry[`episode-${epN}-${skey}`];
    if (!url || !url.trim() || /vidsrc/i.test(url)) continue;
    srvs.push({ key: `m4u_ep${epN}_${skey}`, label: M4U_SERVER_LABELS[skey] || skey, badge: 'M4UHD', url: url.trim(), source: 'm4uhd', adBlock: true });
  }
  return srvs;
}

function renderM4UList() {
  const list = document.getElementById('srv-list-inner');
  const qRow = document.getElementById('qual-row');
  qRow.innerHTML = ''; qRow.style.display = 'none'; list.innerHTML = '';
  document.getElementById('hi-subsrc-row').classList.remove('show');
  document.getElementById('srv-loading').classList.remove('show');

  const entry = m4uMovieEntry || m4uSeriesEntry;
  if (!entry) {
    list.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:8px 0;line-height:1.6">No M4UHD data available for this anime.<br><span style="font-size:11px;color:var(--text3)">Try AnisantCH or HiAnime sources.</span></div>`;
    return;
  }

  const srvs = m4uMovieEntry
    ? M4U_ALLOWED_SERVERS.filter(skey => entry[skey] && !/vidsrc/i.test(entry[skey])).map(skey => ({ key: `m4u_mv_${skey}`, label: M4U_SERVER_LABELS[skey] || skey, badge: 'M4UHD', url: entry[skey].trim(), source: 'm4uhd', adBlock: true }))
    : buildM4USrvs(entry, playerEp);

  if (!srvs.length) {
    list.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No M4UHD servers for Episode ${playerEp}.</div>`;
    return;
  }

  srvs.forEach((srv, i) => {
    const btn = document.createElement('button');
    btn.className = 'srv-item m4u' + (i === 0 ? ' active' : '');
    btn.innerHTML = `<span>${srv.label}</span><span class="srv-badge-sm">M4UHD</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.srv-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeServer = srv; prefSrvKey = srv.key;
      playM4USrv(srv);
    };
    list.appendChild(btn);
    if (i === 0) activeServer = srv;
  });
  if (srvs[0]) playM4USrv(srvs[0]);
}

function playM4USrv(srv) {
  if (!srv?.url) return;
  loadIframe(srv.url, true);
  watchEnd(document.getElementById('pf-adblock'), playerMalId, playerEp, playerLang);
}

//  ANISKIP (INTRO / OUTRO SKIP)
// ═══════════════════════════════════════════════════════════
async function fetchSkipTimes(malId, ep) {
  if (!malId || !ep) return;
  skipTimes = { op: null, ed: null }; clearSkipUI();
  try {
    const r = await fetch(`${ANISKIP_BASE}/${malId}/${ep}?types[]=op&types[]=ed&episodeLength=0`);
    if (!r.ok) return;
    const data = await r.json();
    if (!data.found || !data.results?.length) return;
    for (const item of data.results) {
      if (item.skip_type === 'op') skipTimes.op = { start: item.interval.start_time, end: item.interval.end_time };
      if (item.skip_type === 'ed') skipTimes.ed = { start: item.interval.start_time, end: item.interval.end_time };
    }
    updateSkipInfoPanel(); startSkipFakeClock();
  } catch (e) {}
}

function clearSkipUI() {
  document.getElementById('skip-op-btn').style.display = 'none';
  document.getElementById('skip-ed-btn').style.display = 'none';
  document.getElementById('skip-bar').classList.remove('show');
  document.getElementById('skip-info-row').classList.remove('show');
  document.getElementById('skip-info-inner').innerHTML = '';
  stopSkipFakeClock();
}

function updateSkipInfoPanel() {
  const inner = document.getElementById('skip-info-inner'); inner.innerHTML = '';
  const row   = document.getElementById('skip-info-row');
  if (!skipTimes.op && !skipTimes.ed) { row.classList.remove('show'); return; }
  row.classList.add('show');
  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  if (skipTimes.op) inner.innerHTML += `<div class="skip-time-row"><div class="skip-dot skip-dot-op"></div><span class="skip-time-label">Intro</span><span class="skip-time-val">${fmt(skipTimes.op.start)} – ${fmt(skipTimes.op.end)}</span></div>`;
  if (skipTimes.ed) inner.innerHTML += `<div class="skip-time-row"><div class="skip-dot skip-dot-ed"></div><span class="skip-time-label">Outro</span><span class="skip-time-val">${fmt(skipTimes.ed.start)} – ${fmt(skipTimes.ed.end)}</span></div>`;
}

function startSkipFakeClock() {
  stopSkipFakeClock(); skipFakeTime = 0;
  skipFakeTimer = setInterval(() => {
    skipFakeTime++; const t = skipFakeTime;
    const opBtn = document.getElementById('skip-op-btn');
    const edBtn = document.getElementById('skip-ed-btn');
    let anyVisible = false;
    if (skipTimes.op && t >= skipTimes.op.start - 2 && t < skipTimes.op.end) {
      const rem = Math.max(0, Math.round(skipTimes.op.end - t));
      opBtn.style.display = ''; document.getElementById('skip-op-timer').textContent = rem > 0 ? rem + 's' : ''; anyVisible = true;
    } else { opBtn.style.display = 'none'; }
    if (skipTimes.ed && t >= skipTimes.ed.start - 2 && t < skipTimes.ed.end) {
      const rem = Math.max(0, Math.round(skipTimes.ed.end - t));
      edBtn.style.display = ''; document.getElementById('skip-ed-timer').textContent = rem > 0 ? rem + 's' : ''; anyVisible = true;
    } else { edBtn.style.display = 'none'; }
    document.getElementById('skip-bar').classList.toggle('show', anyVisible);
  }, 1000);
}

function stopSkipFakeClock() { if (skipFakeTimer) { clearInterval(skipFakeTimer); skipFakeTimer = null; } skipFakeTime = 0; }
function skipIntro() { if (!skipTimes.op) return; skipFakeTime = Math.ceil(skipTimes.op.end) + 1; document.getElementById('skip-op-btn').style.display = 'none'; document.getElementById('skip-bar').classList.remove('show'); trySeekFrame(skipTimes.op.end); }
function skipOutro() { if (!skipTimes.ed) return; skipFakeTime = Math.ceil(skipTimes.ed.end) + 1; document.getElementById('skip-ed-btn').style.display = 'none'; document.getElementById('skip-bar').classList.remove('show'); trySeekFrame(skipTimes.ed.end); }
function trySeekFrame(t) {
  const frames = [document.getElementById('pf-plain'), document.getElementById('pf-sb'), document.getElementById('pf-adblock')];
  const active = frames.find(f => f.style.display !== 'none');
  if (active) { try { active.contentWindow.postMessage({ action: 'seekTo', time: t }, '*'); } catch {} }
}

  const a = heroAnime;
  document.getElementById('hero-title').textContent = showTitle(a);
  document.getElementById('hero-desc').textContent  = a.synopsis?.replace(/\[Written.*\]/, '').trim() || '';
  const meta = document.getElementById('hero-meta'); meta.innerHTML = '';
  if (a.score) meta.innerHTML += `<span class="hero-score">★ ${a.score}</span>`;
  if (a.episodes) meta.innerHTML += `<span class="hero-ep">${a.episodes} eps</span>`;
  (a.genres || []).slice(0, 3).forEach(g => { meta.innerHTML += `<span class="hero-tag">${g.name}</span>`; });

  }

function skeletonCards(n, container, row = false) {
  container.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = row ? 'anime-card' : '';
    if (row) { d.style.flexShrink = '0'; d.style.width = '140px'; }
    d.innerHTML = `<div class="skeleton skel-card" style="padding-top:${row ? '145%' : '200px'};border-radius:12px"></div>`;
    container.appendChild(d);
  }
}

  else if (type === 'top') { setGridTitle('<span class="dot" style="background:var(--pink)"></span> Top Rated Anime'); list = await getTopAnime(); }
  else { setGridTitle('<span class="dot" style="background:#34d399"></span> Popular Anime'); list = await getPopularAnime(); }
  if (myToken !== sectionLoadToken) return;
  grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div style="grid-column:1/-1;padding:30px 0;text-align:center;color:var(--text2);font-size:13px">No results found.</div>'; return; }
  list.forEach(a => grid.appendChild(renderCard(a)));
}

const searchInp = document.getElementById('search-inp');
const searchDD  = document.getElementById('search-dropdown');

searchInp.addEventListener('input', () => {
  clearTimeout(debounceT);
  const q = searchInp.value.trim();
  if (!q) { searchDD.classList.remove('show'); return; }
  debounceT = setTimeout(() => doSearch(q), 350);
});

searchInp.addEventListener('focus', () => {
  if (searchInp.value.trim() && searchDD.innerHTML.trim()) searchDD.classList.add('show');
});

document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) searchDD.classList.remove('show'); });

async function doSearch(q) {
  searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">Searching MyAnimeList…</div>';
  searchDD.classList.add('show');
  try {
    const results = await searchAnimeMAL(q);
    searchDD.innerHTML = '';
    if (!results.length) { searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">No anime found.</div>'; return; }
    results.forEach(a => {
      const el = document.createElement('div'); el.className = 'sd-item';
      el.innerHTML = `
        <img class="sd-img" src="${a.images?.jpg?.small_image_url || ''}" alt="" loading="lazy">
        <div class="sd-info">
          <div class="sd-title">${showTitle(a)}</div>
          <div class="sd-meta">${a.type || 'Anime'} · ${a.year || '—'}${a.episodes ? ` · ${a.episodes} eps` : ''}</div>
          ${a.score ? `<div class="sd-score">★ ${a.score}</div>` : ''}
        </div>`;
      el.onclick = () => { searchDD.classList.remove('show'); searchInp.value = ''; openEpModal(a); };
      searchDD.appendChild(el);
    });
  } catch (e) {
    searchDD.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--text2)">Search failed. Please try again.</div>';
  }
}

// ═══════════════════════════════════════════════════════════
//  EPISODE MODAL
// ═══════════════════════════════════════════════════════════
async function openEpModal(show) {
  modalAnime = show; modalLang = 'dub';
  document.getElementById('em-dub').classList.add('active');
  document.getElementById('em-sub').classList.remove('active');
  document.getElementById('ep-modal-title').textContent = showTitle(show);
  document.getElementById('ep-modal-poster').src = show.images?.jpg?.image_url || '';
  const meta = document.getElementById('ep-modal-meta'); meta.innerHTML = '';
  if (show.score)    meta.innerHTML += `<span class="em-badge">★ ${show.score}</span>`;
  if (show.type)     meta.innerHTML += `<span class="em-badge">${show.type}</span>`;
  if (show.status)   meta.innerHTML += `<span class="em-badge">${show.status}</span>`;
  if (show.episodes) meta.innerHTML += `<span class="em-badge">${show.episodes} eps</span>`;
  meta.innerHTML += `<span class="em-badge" style="background:rgba(108,99,255,.25);color:var(--accent2)">MAL #${show.mal_id}</span>`;

  document.getElementById('ep-list').innerHTML = '<div id="ep-list-loading"><div class="loading-spin"></div></div>';
  document.getElementById('ep-modal-bg').classList.add('show');
  document.getElementById('em-ep-search').value = '';

  let total = show.episodes || 0;
  if (!total && show.mal_id) {
    const full = await getAnimeDetailsMAL(show.mal_id);
    if (full) { modalAnime = full; total = full.episodes || 12; }
  }
  playerTotal = total || 12;
  renderEpList(playerTotal);
}

function renderEpList(total) {
  const list = document.getElementById('ep-list'); list.innerHTML = '';
  total = Math.max(1, parseInt(total, 10) || 1);
  const frag = document.createDocumentFragment(); const btns = [];
  for (let i = 1; i <= total; i++) {
    const btn = document.createElement('button');
    btn.className = 'ep-btn'; btn.textContent = i; btn.dataset.ep = i;
    btn.onclick = () => startWatch(modalAnime, i, modalLang);
    frag.appendChild(btn); btns.push(btn);
  }
  list.appendChild(frag);
  const si = document.getElementById('em-ep-search'); si.max = total;
  const fresh = si.cloneNode(true); si.parentNode.replaceChild(fresh, si);
  fresh.addEventListener('input', function() {
    const v = parseInt(this.value, 10);
    btns.forEach(b => b.classList.remove('active'));
    if (!isNaN(v) && v >= 1 && v <= total) {
      const t = btns[v - 1];
      if (t) { t.classList.add('active'); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    }
  });
}

function setModalLang(lang) {
  modalLang = lang;
  document.getElementById('em-dub').classList.toggle('active', lang === 'dub');
  document.getElementById('em-sub').classList.toggle('active', lang === 'sub');
}
function closeEpModal() { document.getElementById('ep-modal-bg').classList.remove('show'); }
document.getElementById('ep-modal-bg').addEventListener('click', e => { if (e.target === document.getElementById('ep-modal-bg')) closeEpModal(); });

// ═══════════════════════════════════════════════════════════
//  START WATCH & NAVIGATION
// ═══════════════════════════════════════════════════════════
function startWatch(show, ep, lang) {
  closeEpModal();
  playerMalId = show.mal_id || show.id;
  playerEp    = ep; playerLang  = lang;
  playerTitle = showTitle(show); playerTotal = show.episodes || playerTotal || 24;

  document.getElementById('view-player').classList.add('active');
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('player-show-title').textContent = playerTitle;
  document.getElementById('player-ep-label').textContent   = `Episode ${ep}`;
  document.getElementById('pl-dub').classList.toggle('active', lang === 'dub');
  document.getElementById('pl-sub').classList.toggle('active', lang === 'sub');

  m4uSeriesEntry = null; m4uMovieEntry = null; animeggEntry = null; anidbEntry = null;
  loadEpisode(playerMalId, ep, lang);
}

function goHome() {
  cancelAN(); stopEndWatch(); clearSkipUI();
  document.getElementById('view-player').classList.remove('active');
  document.getElementById('view-home').classList.remove('hidden');
  ['pf-plain','pf-sb','pf-adblock'].forEach(id => {
    const f = document.getElementById(id); f.src = 'about:blank'; f.style.display = 'none';
  });
  document.getElementById('player-ph').style.display = 'flex';
}

function openEpPickerFromPlayer() {
  if (modalAnime && modalAnime.episodes) {
    setModalLang(playerLang); renderEpList(playerTotal || modalAnime.episodes);
    document.getElementById('ep-modal-bg').classList.add('show');
  }
}

// ═══════════════════════════════════════════════════════════
//  LOAD EPISODE & SERVERS
// ═══════════════════════════════════════════════════════════
async function loadEpisode(malId, ep, lang) {
  cancelAN(); stopEndWatch(); clearSkipUI();
  playerMalId = malId; playerEp = ep; playerLang = lang;
  document.getElementById('player-ep-label').textContent = `Episode ${ep}`;

  setM4UStatus('', false); document.getElementById('tab-m4u').style.opacity = '0.4';
  setAGGStatus('', false); document.getElementById('tab-agg').style.opacity = '0.4';
  setAniDBStatus('', false); document.getElementById('tab-anidb').style.opacity = '0.4';

  const megaSrc = `https://megaplay.buzz/stream/mal/${malId}/${ep}/${lang}?autostart=true`;
  loadIframe(megaSrc);
  serverData = [{ key: 'megaplay', label: 'MegaPlay', badge: 'MAL', url: megaSrc, source: 'anisantch', adBlock: false }];
  hianimeEntry = null; animeggEntry = null; activeServer = serverData[0];

  document.getElementById('qual-row').innerHTML = ''; document.getElementById('srv-list-inner').innerHTML = '';
  document.getElementById('srv-loading').classList.add('show');

  const [aEntry, hiEntry] = await Promise.all([
    fetchACEntry(malId, ep, lang),
    fetchHiEntry(malId, ep),
    fetchSkipTimes(malId, ep),
    fetchM4UForCurrentMedia(),
    fetchAnimeGGForCurrentMedia(),
    fetchAniDBForCurrentMedia()
  ]);

  document.getElementById('srv-loading').classList.remove('show');
  if (aEntry)  serverData = [serverData[0], ...buildACSrvs(aEntry)];
  if (hiEntry) hianimeEntry = hiEntry;

  updateSrcTabOpacity();
  if (activeSrc === 'hianime') renderHiList();
  else if (activeSrc === 'm4uhd') renderM4UList();
  else if (activeSrc === 'animegg') renderAnimeGGList();
  else if (activeSrc === 'anidb') renderAniDBList();
  else renderACList();

  const activeFrame = document.getElementById('pf-plain').style.display !== 'none' ? document.getElementById('pf-plain') : document.getElementById('pf-sb');
  watchEnd(activeFrame, malId, ep, lang);
}

// ═══════════════════════════════════════════════════════════
//  ANIMEGG FETCH & RENDER
// ═══════════════════════════════════════════════════════════
async function fetchAnimeGGForCurrentMedia() {
  if (!playerMalId) return;
  document.getElementById('tab-agg').style.opacity = '1';
  try {
    const entry = await fetchAnimeGGEntry(playerMalId);
    animeggEntry = entry;
    if (entry) {
      const url = getAnimeGGUrl(entry, playerEp, playerLang);
      if (url) setAGGStatus(`✓ AnimeGG + FlixLoud`, true);
      else setAGGStatus(`FlixLoud available · ep ${playerEp} not in AnimeGG`, true);
    } else {
      setAGGStatus('FlixLoud available · Not in AnimeGG library', true);
    }
    if (activeSrc === 'animegg') renderAnimeGGList();
  } catch(e) { setAGGStatus('FlixLoud available', true); }
}

function setAGGStatus(text, found) {
  const row  = document.getElementById('agg-status-row');
  const span = document.getElementById('agg-status-text');
  if (!text) { row.classList.remove('show'); return; }
  span.textContent = text; row.classList.add('show');
  row.style.background  = found ? 'rgba(52,211,153,.08)'  : 'rgba(34,211,238,.08)';
  row.style.borderColor = found ? 'rgba(52,211,153,.25)'  : 'rgba(34,211,238,.25)';
  row.style.color       = found ? 'var(--green)'          : 'var(--teal)';
}

function renderAnimeGGList() {
  const list = document.getElementById('srv-list-inner');
  const qRow = document.getElementById('qual-row');
  qRow.innerHTML = ''; qRow.style.display = 'none'; list.innerHTML = '';
  document.getElementById('hi-subsrc-row').classList.remove('show');
  document.getElementById('srv-loading').classList.remove('show');

  const srvs = [];
  if (playerMalId) srvs.push({ key: `flixloud_ep${playerEp}`, label: 'FlixLoud', badge: 'FlixLoud', url: `https://donkarboy.github.io/flixloud/${playerMalId}/${playerEp}`, source: 'animegg', lang: playerLang, adBlock: true });

  if (animeggEntry) {
    const epObj = animeggEntry.episodes?.find(e => parseInt(e.ep, 10) === parseInt(playerEp, 10));
    if (epObj) {
      if (epObj.dub) srvs.push({ key: `agg_ep${playerEp}_dub`, label: 'AnimeGG DUB', badge: 'AnimeGG', url: epObj.dub, source: 'animegg', lang: 'dub', adBlock: false });
      if (epObj.sub) srvs.push({ key: `agg_ep${playerEp}_sub`, label: 'AnimeGG SUB', badge: 'AnimeGG', url: epObj.sub, source: 'animegg', lang: 'sub', adBlock: false });
    }
  }

  const prefer = playerLang; const di = Math.max(0, srvs.findIndex(s => s.lang === prefer));
  srvs.forEach((srv, i) => {
    const btn = document.createElement('button');
    btn.className = 'srv-item agg' + (i === di ? ' active' : '');
    btn.innerHTML = `<span>${srv.label}</span><span class="srv-badge-sm">${srv.badge}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.srv-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); activeServer = srv; prefSrvKey = srv.key;
      playAnimeGGSrv(srv);
    };
    list.appendChild(btn); if (i === di) activeServer = srv;
  });
  if (srvs[di]) playAnimeGGSrv(srvs[di]);
}

function playAnimeGGSrv(srv) {
  if (!srv?.url) return;
  loadIframe(srv.url, !!srv.adBlock);
  watchEnd(srv.adBlock ? document.getElementById('pf-adblock') : document.getElementById('pf-plain'), playerMalId, playerEp, playerLang);
}

// ═══════════════════════════════════════════════════════════
//  ANISANTCH FETCH & RENDER
// ═══════════════════════════════════════════════════════════
async function fetchACEntry(malId, ep, lang) {
  const key    = `${malId}/${ep}==${lang}`;
  const altKey = `${malId}/${ep}==${lang === 'dub' ? 'sub' : 'dub'}`;
  const res = await Promise.all(JSON_FILES.map(f => fetch(JSON_BASE + f).then(r => r.ok ? r.json() : []).catch(() => [])));
  const all = res.flat();
  return all.find(e => e.mal_id_with_ep_and_stream_type === key) || all.find(e => e.mal_id_with_ep_and_stream_type === altKey) || null;
}

function getAllanimeUrl(entry, q) {
  const want  = parseInt(q, 10);
  const avail = Q_TIERS.filter(t => entry[`allanime_${t}`]);
  if (!avail.length) return null;
  const best  = avail.reduce((a, b) => Math.abs(a - want) <= Math.abs(b - want) ? a : b);
  return entry[`allanime_${best}`] || null;
}

function buildACSrvs(entry) {
  const s = [];
  if (Q_TIERS.some(q => entry[`allanime_${q}`])) s.push({ key: 'allanime', label: 'AllanimeHD', type: 'multi-quality', entry, source: 'anisantch' });
  if (entry.anivibe) s.push({ key: 'anivibe', label: 'AniVibe', url: entry.anivibe, source: 'anisantch' });
  if (entry.okcdn)   s.push({ key: 'okcdn',   label: 'OkCDN',   url: entry.okcdn,   source: 'anisantch' });
  const cdn = getAnicdnUrl(entry); if (cdn) s.push({ key: 'anicdn', label: 'AniCDN', badge: 'Multi-Lang', url: cdn, source: 'anisantch' });
  const sw  = getSwiftUrl(entry);  if (sw)  s.push({ key: 'swift',  label: 'Swift',  badge: 'HI',         url: sw,  source: 'anisantch' });
  return s;
}

function getAnicdnUrl(e) { const r = e.anicdn_iframe || e.anicdn; if (!r) return null; const m = r.match(/\/anicdn\/([^/]+)/); return m ? `https://as-cdn21.top/video/${m[1]}` : null; }
function getSwiftUrl(e)  { const r = e.swift_iframe || e.swift;   if (!r) return null; const m = r.match(/\/swift\/([^/]+)/);  return m ? `https://argon.razorshell.space/embed/${m[1]}` : null; }

function renderACList() {
  const qRow = document.getElementById('qual-row'); const list = document.getElementById('srv-list-inner');
  qRow.innerHTML = ''; list.innerHTML = ''; qRow.style.display = '';
  if (!serverData.length) { list.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No AnisantCH servers for this episode.</div>'; return; }
  const allanime = serverData.find(s => s.type === 'multi-quality');
  if (allanime) {
    Q_TIERS.forEach(q => {
      const avail = !!allanime.entry[`allanime_${q}`];
      const pill  = document.createElement('button');
      pill.className = 'q-pill' + (q === parseInt(activeQual) ? ' active' : '') + (avail ? '' : ' unavail');
      pill.textContent = q + 'p';
      if (avail) pill.onclick = () => {
        activeQual = String(q); document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active')); pill.classList.add('active');
        if (activeServer?.key === 'allanime') playSrv(activeServer);
      };
      qRow.appendChild(pill);
    });
  }
  const defIdx = prefSrvKey ? serverData.findIndex(s => s.key === prefSrvKey && s.source === 'anisantch') : 0;
  const di = defIdx >= 0 ? defIdx : 0;
  serverData.forEach((srv, i) => {
    const btn = document.createElement('button'); btn.className = 'srv-item' + (i === di ? ' active' : '');
    btn.innerHTML = `<span>${srv.label}</span><span class="srv-badge-sm">${srv.badge || 'HD'}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.srv-item').forEach(b => b.classList.remove('active')); btn.classList.add('active');
      activeServer = srv; prefSrvKey = srv.key; playSrv(srv);
    };
    list.appendChild(btn); if (i === di) activeServer = srv;
  });
  if (serverData[di]) playSrv(serverData[di]);
}

// ═══════════════════════════════════════════════════════════
//  HIANIME FETCH & RENDER
// ═══════════════════════════════════════════════════════════
async function loadHiRaw() {
  if (_hiCacheRaw) return _hiCacheRaw; if (_hiLoadProm) return _hiLoadProm;
  _hiLoadProm = Promise.all(HIANIME_FILES.map(f => fetch(HIANIME_BASE + f).then(r => r.ok ? r.json() : []).catch(() => [])))
    .then(res => { _hiCacheRaw = res.flat().filter(Boolean); _hiLoadProm = null; return _hiCacheRaw; });
  return _hiLoadProm;
}

async function fetchHiEntry(malId, ep) {
  const all = await loadHiRaw(); const mid = parseInt(malId, 10), epn = parseInt(ep, 10);
  return all.find(e => parseInt(e['mal_id/anilist_id/tmdb_id'], 10) === mid && parseInt(e.episode_no, 10) === epn) || null;
}

function getHiUrl(entry, lang, ss) {
  for (const p of lang === 'sub' ? [lang, 'hsub'] : [lang]) {
    const k = `${p}_${ss}_embed_url_ep_${entry.episode_no}`; if (entry[k]) return entry[k];
  }
  return null;
}

function buildHiSrvs(entry, lang) {
  return HI_SS.flatMap(ss => { const url = getHiUrl(entry, lang, ss); return url ? [{ key: 'hi_' + ss, label: ss.charAt(0).toUpperCase() + ss.slice(1), url, source: 'hianime', subsrc: ss }] : []; });
}

function renderHiList() {
  const list = document.getElementById('srv-list-inner'); list.innerHTML = '';
  if (!hianimeEntry) { list.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No HiAnime data for this episode.</div>'; return; }
  const srvs = buildHiSrvs(hianimeEntry, playerLang);
  if (!srvs.length) { list.innerHTML = `<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No HiAnime ${playerLang.toUpperCase()} streams found.</div>`; return; }
  const di = Math.max(0, srvs.findIndex(s => s.subsrc === activeHiSS));
  srvs.forEach((srv, i) => {
    const btn = document.createElement('button'); btn.className = 'srv-item hi' + (i === di ? ' active' : '');
    btn.innerHTML = `<span>${srv.label}</span><span class="srv-badge-sm">HiAnime</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.srv-item').forEach(b => b.classList.remove('active')); btn.classList.add('active');
      activeServer = srv; prefSrvKey = srv.key; activeHiSS = srv.subsrc; setHiSS(srv.subsrc); playSrv(srv);
    };
    list.appendChild(btn); if (i === di) activeServer = srv;
  });
  if (srvs[di]) playSrv(srvs[di]);
}

function setHiSS(ss) {
  activeHiSS = ss; document.querySelectorAll('.subsrc-pill').forEach(p => p.classList.toggle('active', p.dataset.ss === ss)); renderHiList();
}

function playSrv(srv) {
  let url;
  if (srv.type === 'multi-quality') {
    url = getAllanimeUrl(srv.entry, activeQual);
    if (!url) for (const q of [480, 720, 360, 1080]) { url = srv.entry[`allanime_${q}`]; if (url) break; }
  } else { url = srv.url; }
  if (!url) return;
  loadIframe(url, !!srv.adBlock);
  const frame = needsAdBlock(url) || srv.adBlock ? document.getElementById('pf-adblock') : document.getElementById('pf-sb');
  watchEnd(frame, playerMalId, playerEp, playerLang);
}

// ═══════════════════════════════════════════════════════════
//  PLAYER CONTROLS & AUTO NEXT
// ═══════════════════════════════════════════════════════════
function playerSetLang(lang) { playerLang = lang; document.getElementById('pl-dub').classList.toggle('active', lang === 'dub'); document.getElementById('pl-sub').classList.toggle('active', lang === 'sub'); loadEpisode(playerMalId, playerEp, lang); }
function playerPrev() { if (playerEp > 1) { loadEpisode(playerMalId, --playerEp, playerLang); document.getElementById('player-ep-label').textContent = `Episode ${playerEp}`; } }
function playerNext() { loadEpisode(playerMalId, ++playerEp, playerLang); document.getElementById('player-ep-label').textContent = `Episode ${playerEp}`; }

function stopEndWatch() { clearInterval(endWatchInt); endWatchInt = null; if (endWatchClean) { endWatchClean(); endWatchClean = null; } }

function watchEnd(iframe, malId, ep, lang) {
  stopEndWatch(); let active = true;
  function onMsg(e) { if (!active) return; const s = typeof e.data === 'string' ? e.data : JSON.stringify(e.data || ''); if (/ended|complete|finish|event.*end/i.test(s)) { cleanup(); triggerAN(malId, ep, lang); } }
  window.addEventListener('message', onMsg);
  let settled = false; const st = setTimeout(() => { settled = true; }, 1500);
  endWatchInt = setInterval(() => { if (!active || !settled) return; try { const s = iframe.src || ''; if (s === '' || s === 'about:blank') { cleanup(); triggerAN(malId, ep, lang); } } catch (_) {} }, 2000);
  function cleanup() { active = false; clearTimeout(st); clearInterval(endWatchInt); endWatchInt = null; window.removeEventListener('message', onMsg); endWatchClean = null; }
  endWatchClean = cleanup;
}

function triggerAN(malId, ep, lang) {
  if (!document.getElementById('chk-an').checked) return;
  const next = parseInt(ep, 10) + 1;
  document.getElementById('an-ep-lbl').textContent = `Episode ${next}`;
  const ov = document.getElementById('an-overlay'); const bar = document.getElementById('an-bar');
  ov.style.display = 'flex'; bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; bar.getBoundingClientRect();
  bar.style.transition = `transform ${COUNTDOWN}s linear`; bar.style.transform = 'scaleX(0)';
  let rem = COUNTDOWN; anTimer = setInterval(() => { if (--rem <= 0) anPlayNow(); }, 1000);
}

function anPlayNow() { cancelAN(); playerNext(); }
function cancelAN() {
  clearInterval(anTimer); anTimer = null;
  const ov = document.getElementById('an-overlay'); if (ov) ov.style.display = 'none';
  stopEndWatch();
}

// ═══════════════════════════════════════════════════════════
//  IFRAME & AD-BLOCK
// ═══════════════════════════════════════════════════════════
const ADBLOCK_HOSTS = [/insertunit\.ws/i, /nxsha\.app/i, /111movies\.net/i, /anyembed\.xyz/i, /nontongo\.win/i, /abyssplayer\.com/i, /ppzj-youtube/i, /youtube-prime\.rpmvip/i];
function needsAdBlock(url) { return ADBLOCK_HOSTS.some(re => re.test(url)); }
function isMega(url) { return /megaplay\.buzz/i.test(url); }

function loadIframe(url, forceAdBlock = false) {
  const plain = document.getElementById('pf-plain'); const sb = document.getElementById('pf-sb'); const adblock = document.getElementById('pf-adblock'); const ph = document.getElementById('player-ph');
  stopEndWatch(); ph.style.display = 'none';
  function hideAll() { plain.style.display = 'none'; plain.src = 'about:blank'; sb.style.display = 'none'; sb.src = 'about:blank'; adblock.style.display = 'none'; adblock.src = 'about:blank'; }
  if (forceAdBlock || needsAdBlock(url)) { hideAll(); adblock.src = url; adblock.style.display = 'block'; }
  else if (isMega(url)) { hideAll(); plain.src = url; plain.style.display = 'block'; }
  else { hideAll(); sb.src = url; sb.style.display = 'block'; }
}

// ═══════════════════════════════════════════════════════════
//  SERVER PANEL DROPDOWN / SCROLL
// ═══════════════════════════════════════════════════════════
function toggleSrvPanel() {
  const sec = document.getElementById('player-server-section');
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function switchSrc(src) {
  activeSrc = src;
  document.getElementById('tab-ac').classList.toggle('active', src === 'anisantch');
  document.getElementById('tab-hi').classList.toggle('active', src === 'hianime');
  document.getElementById('tab-agg').classList.toggle('active', src === 'animegg');
  document.getElementById('tab-anidb').classList.toggle('active', src === 'anidb');
  document.getElementById('tab-m4u').classList.toggle('active', src === 'm4uhd');
  const hiRow = document.getElementById('hi-subsrc-row'); const qRow = document.getElementById('qual-row');

  document.getElementById('m4u-status-row').classList.remove('show');
  document.getElementById('agg-status-row').classList.remove('show');
  document.getElementById('anidb-status-row').classList.remove('show');

  const ph = document.getElementById('player-ph');
  if (ph.querySelector('a')) ph.innerHTML = '<div class="loading-spin"></div>';

  if (src === 'hianime') { hiRow.classList.add('show'); qRow.style.display = 'none'; renderHiList(); }
  else if (src === 'm4uhd') { hiRow.classList.remove('show'); qRow.style.display = 'none'; renderM4UList(); }
  else if (src === 'animegg') { hiRow.classList.remove('show'); qRow.style.display = 'none'; renderAnimeGGList(); }
  else if (src === 'anidb') { hiRow.classList.remove('show'); qRow.style.display = 'none'; renderAniDBList(); }
  else { hiRow.classList.remove('show'); qRow.style.display = ''; renderACList(); }
}

function updateSrcTabOpacity() {
  document.getElementById('tab-ac').style.opacity = serverData.length ? '1' : '0.4';
  document.getElementById('tab-hi').style.opacity = hianimeEntry ? '1' : '0.4';
  document.getElementById('tab-agg').style.opacity = playerMalId ? '1' : '0.4';
  document.getElementById('tab-anidb').style.opacity = anidbEntry ? '1' : '0.4';
  document.getElementById('tab-m4u').style.opacity = (m4uSeriesEntry || m4uMovieEntry) ? '1' : '0.4';
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
initHome();
</script>
