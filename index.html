<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaPlay Player</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e2e8;
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

    /* ── Top bar wrapper ── */
    #topbar {
      position: relative;
      background: #13131a;
      border-bottom: 1px solid #222230;
      flex-shrink: 0;
      overflow: visible;
      z-index: 50;
    }

    #topbar-row {
      display: flex;
      align-items: center;
      overflow: visible;
    }

    #topbar-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 8px 0 14px;
      max-height: 0;
      overflow: hidden;
      transition: max-height .28s ease, padding .28s ease;
      flex: 1;
    }
    #topbar-inner.open {
      max-height: 200px;
      padding: 8px 8px 8px 14px;
    }

    .brand {
      font-size: 13px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #7c6dfa; white-space: nowrap;
    }

    .field-group { display: flex; align-items: center; gap: 6px; }
    .field-group label {
      font-size: 11px; color: #888;
      text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    }
    .field-group input {
      width: 80px; padding: 4px 8px;
      background: #1e1e2e; border: 1px solid #2e2e42;
      border-radius: 6px; color: #e2e2e8; font-size: 13px;
      outline: none; transition: border-color .15s;
    }
    .field-group input:focus { border-color: #7c6dfa; }

    #lang-toggle {
      display: flex; background: #1e1e2e;
      border: 1px solid #2e2e42; border-radius: 8px;
      overflow: hidden; flex-shrink: 0;
    }
    #lang-toggle button {
      padding: 5px 14px; font-size: 12px; font-weight: 600;
      border: none; background: transparent; color: #888;
      cursor: pointer; transition: background .15s, color .15s;
    }
    #lang-toggle button.active { background: #7c6dfa; color: #fff; }

    #autonext-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    #autonext-wrap span {
      font-size: 11px; color: #888;
      text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
    }
    .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #2e2e42;
      border-radius: 20px; cursor: pointer; transition: background .2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: transform .2s;
    }
    .switch input:checked + .slider { background: #7c6dfa; }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    .ctrl-btns { display: flex; gap: 6px; align-items: center; }

    .bar-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 14px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: background .15s, transform .1s;
    }
    .bar-btn:active { transform: scale(.96); }

    #btn-prev-bar, #btn-next-bar {
      background: #1e1e2e; color: #aaa; border: 1px solid #2e2e42;
    }
    #btn-prev-bar:hover, #btn-next-bar:hover {
      background: rgba(124,109,250,.18); border-color: #7c6dfa; color: #fff;
    }
    #btn-go { background: #7c6dfa; color: #fff; }
    #btn-go:hover { background: #6a5be0; }

    #srv-wrap {
      display: none;
      align-items: center;
      flex-shrink: 0;
    }
    #srv-wrap.show { display: flex; }

    #srv-toggle-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px;
      background: #1e1e2e;
      border: 1px solid #2e2e42;
      border-radius: 8px; color: #aaa; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all .15s;
    }
    #srv-toggle-btn:hover  { border-color: #7c6dfa; color: #fff; background: rgba(124,109,250,.18); }
    #srv-toggle-btn.open   { border-color: #7c6dfa; color: #fff; background: rgba(124,109,250,.22); }

    /* Server panel dropdown */
    #server-panel {
      display: none;
      position: fixed;
      top: auto;
      left: auto;
      z-index: 9999;
      background: #13131a;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 12px 14px;
      min-width: 280px;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,.7);
    }
    #server-panel.visible { display: block; }

    .sp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .sp-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .07em; }
    #sp-close {
      background: none; border: none; color: #666;
      cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px;
    }
    #sp-close:hover { color: #aaa; }

    /* Source tabs (existing servers vs HiAnime) */
    #source-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      background: #0e0e18;
      border-radius: 8px;
      padding: 3px;
    }
    .src-tab {
      flex: 1; padding: 5px 8px;
      border: none; border-radius: 6px;
      font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all .15s;
      background: transparent; color: #666;
      letter-spacing: .04em; white-space: nowrap;
    }
    .src-tab.active { background: #7c6dfa; color: #fff; }
    .src-tab:hover:not(.active) { color: #aaa; background: rgba(255,255,255,.04); }

    /* HiAnime sub-source tabs */
    #hianime-subsrc {
      display: none;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    #hianime-subsrc.show { display: flex; }
    .subsrc-tab {
      padding: 3px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 600;
      cursor: pointer; border: 1px solid #2e2e42;
      background: #1e1e2e; color: #888;
      transition: all .15s;
    }
    .subsrc-tab.active { background: #fa6d9a; border-color: #fa6d9a; color: #fff; }
    .subsrc-tab:hover:not(.active) { border-color: #fa6d9a; color: #ccc; }

    #quality-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .q-pill {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: 1px solid #2e2e42; background: #1e1e2e; color: #888;
      transition: all .15s;
    }
    .q-pill.active  { background: #7c6dfa; border-color: #7c6dfa; color: #fff; }
    .q-pill:hover:not(.active):not(.unavail) { border-color: #7c6dfa; color: #ccc; }
    .q-pill.unavail { opacity: .3; cursor: default; pointer-events: none; }

    #server-list { display: flex; flex-direction: column; gap: 5px; max-height: 220px; overflow-y: auto; }
    #server-list::-webkit-scrollbar { width: 4px; }
    #server-list::-webkit-scrollbar-thumb { background: #2e2e42; border-radius: 4px; }

    .srv-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 8px; border: 1px solid #2e2e42;
      background: #1a1a26; color: #ccc; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s; text-align: left; width: 100%;
    }
    .srv-btn:hover  { background: rgba(124,109,250,.18); border-color: #7c6dfa; color: #fff; }
    .srv-btn.active { background: rgba(124,109,250,.28); border-color: #7c6dfa; color: #fff; }
    /* HiAnime server buttons get a pink accent */
    .srv-btn.hianime-srv:hover  { background: rgba(250,109,154,.15); border-color: #fa6d9a; color: #fff; }
    .srv-btn.hianime-srv.active { background: rgba(250,109,154,.25); border-color: #fa6d9a; color: #fff; }

    .srv-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 10px;
      background: #2e2e42; color: #777; margin-left: 6px; flex-shrink: 0;
    }
    .srv-btn.active .srv-badge { background: #7c6dfa; color: #fff; }
    .srv-btn.hianime-srv.active .srv-badge { background: #fa6d9a; color: #fff; }

    /* HiAnime source label pill */
    .hi-source-pill {
      font-size: 9px; padding: 1px 5px; border-radius: 8px;
      background: rgba(250,109,154,.2); color: #fa6d9a; border: 1px solid rgba(250,109,154,.3);
      margin-left: 5px; flex-shrink: 0; letter-spacing: .04em; font-weight: 700;
    }

    #sp-loading {
      display: flex; align-items: center; gap: 8px;
      color: #666; font-size: 12px; padding: 8px 0;
    }
    .spin {
      width: 14px; height: 14px; border: 2px solid #2e2e42;
      border-top-color: #7c6dfa; border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #sp-error { color: #f87171; font-size: 12px; padding: 4px 0; }

    /* ── Player area ── */
    #player-wrap { flex: 1; position: relative; background: #000; overflow: hidden; }
    #player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1; }

    #placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: #444;
    }
    #placeholder svg { opacity: .3; }
    #placeholder p { font-size: 14px; }
    #placeholder .hint { font-size: 12px; color: #333; }

    #player-iframe { display: none; }

    #toggle-bar-btn {
      position: absolute; top: 10px; right: 12px; z-index: 20;
      width: 32px; height: 32px;
      background: rgba(19,19,26,.85);
      border: 1px solid #2e2e42; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background .15s, border-color .15s;
    }
    #toggle-bar-btn:hover { background: rgba(40,40,60,.95); border-color: #7c6dfa; }
    #toggle-bar-btn svg { display: block; transition: transform .25s ease; }
    #toggle-bar-btn.open svg { transform: rotate(180deg); }

    /* ── Auto-next countdown ── */
    #autonext-overlay {
      display: none; position: absolute; bottom: 28px; right: 28px;
      background: rgba(10,10,15,.9); border: 1px solid #2e2e42;
      border-radius: 14px; padding: 14px 20px; min-width: 220px;
      z-index: 30; backdrop-filter: blur(6px);
    }
    .an-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
    .an-ep    { font-size: 15px; font-weight: 700; color: #e2e2e8; margin-bottom: 10px; }
    #an-bar-bg { width: 100%; height: 4px; background: #2e2e42; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    #an-bar    { height: 100%; width: 100%; background: #7c6dfa; border-radius: 4px; transform-origin: left; transition: transform linear; }
    .an-btns   { display: flex; gap: 8px; }
    .an-btns button {
      flex: 1; padding: 6px 0; border: none;
      border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    #an-btn-now    { background: #7c6dfa; color: #fff; }
    #an-btn-now:hover { background: #6a5be0; }
    #an-btn-cancel { background: #1e1e2e; color: #aaa; border: 1px solid #2e2e42; }
    #an-btn-cancel:hover { background: #2e2e42; }
  </style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-inner">
      <span class="brand">▶ MegaPlay</span>

      <div class="field-group">
        <label>MAL ID</label>
        <input id="inp-mal" type="number" placeholder="e.g. 1735" min="1">
      </div>

      <div class="field-group">
        <label>Episode</label>
        <input id="inp-ep" type="number" placeholder="e.g. 11" min="1">
      </div>

      <div id="lang-toggle">
        <button id="btn-dub" class="active" onclick="setLang('dub')">DUB</button>
        <button id="btn-sub" onclick="setLang('sub')">SUB</button>
      </div>

      <div id="autonext-wrap">
        <span>Auto-Next</span>
        <label class="switch">
          <input type="checkbox" id="chk-autonext" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="ctrl-btns">
        <button class="bar-btn" id="btn-prev-bar" onclick="goPrevEp()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <button class="bar-btn" id="btn-go" onclick="loadPlayer()">▶ Play</button>
        <button class="bar-btn" id="btn-next-bar" onclick="goNextEp()">
          Next
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div id="srv-wrap">
          <button id="srv-toggle-btn" onclick="toggleServerPanel()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="4" rx="1"/>
              <rect x="2" y="10" width="20" height="4" rx="1"/>
              <rect x="2" y="17" width="20" height="4" rx="1"/>
            </svg>
            Servers
          </button>
          <div id="server-panel">
            <div class="sp-row">
              <span class="sp-title">Servers &amp; Quality</span>
              <button id="sp-close" onclick="toggleServerPanel()">✕</button>
            </div>

            <!-- Source tabs: AnisantCH vs HiAnime -->
            <div id="source-tabs">
              <button class="src-tab active" id="tab-anisantch" onclick="switchSource('anisantch')">AnisantCH</button>
              <button class="src-tab" id="tab-hianime" onclick="switchSource('hianime')">
                🌸 HiAnime
              </button>
            </div>

            <!-- HiAnime sub-source selector -->
            <div id="hianime-subsrc">
              <button class="subsrc-tab active" data-subsrc="streamhg"   onclick="setHiSubSrc('streamhg')">StreamHG</button>
              <button class="subsrc-tab"        data-subsrc="earnvids"   onclick="setHiSubSrc('earnvids')">EarnVids</button>
              <button class="subsrc-tab"        data-subsrc="doodstream" onclick="setHiSubSrc('doodstream')">DoodStream</button>
              <button class="subsrc-tab"        data-subsrc="vivibebe"   onclick="setHiSubSrc('vivibebe')">ViviBebe</button>
              <button class="subsrc-tab"        data-subsrc="bibiemb"    onclick="setHiSubSrc('bibiemb')">Bibiemb</button>
            </div>

            <div id="quality-row"></div>
            <div id="sp-loading" style="display:none"><div class="spin"></div>&nbsp;Fetching servers…</div>
            <div id="sp-error"   style="display:none"></div>
            <div id="server-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Player -->
  <div id="player-wrap">

    <button id="toggle-bar-btn" onclick="toggleBar()" title="Toggle controls">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
           stroke="#aaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 8 11 13 6"/>
      </svg>
    </button>

    <div id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
      </svg>
      <p>Click ⌄ top-right to open controls</p>
      <p class="hint">Enter MAL ID + Episode then press Play</p>
    </div>

    <!-- MegaPlay — no sandbox -->
    <iframe id="player-iframe"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="origin"></iframe>

    <!-- All other servers — sandboxed -->
    <iframe id="player-iframe-sb"
            sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            referrerpolicy="no-referrer"
            style="display:none"></iframe>

    <!-- Auto-next countdown -->
    <div id="autonext-overlay">
      <div class="an-title">Up next</div>
      <div class="an-ep" id="an-ep-label">Episode —</div>
      <div id="an-bar-bg"><div id="an-bar"></div></div>
      <div class="an-btns">
        <button id="an-btn-now"    onclick="goNextNow()">Play Now</button>
        <button id="an-btn-cancel" onclick="cancelAutoNext()">Cancel</button>
      </div>
    </div>
  </div>

</div>
<script>
// ─────────────────────────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────────────────────────
const REPO        = '/megaplay_buzz_iframe_player';
const COUNTDOWN_S = 10;

// AnisantCH JSON source
const JSON_BASE  = 'https://raw.githubusercontent.com/donkarboy/anisantch_top/refs/heads/main/';
const JSON_FILES = Array.from({length: 15}, (_, i) =>
  i === 0 ? 'streams.json' : `streams_${i + 1}.json`
);

// HiAnime JSON source — 20 files
// File naming: hianime_streams_list.json, hianime_streams_list_2.json … hianime_streams_list_20.json
const HIANIME_BASE      = 'https://raw.githubusercontent.com/srtfile/hi_anime_streams_scraper/refs/heads/main/';
const HIANIME_JSON_FILES = Array.from({length: 20}, (_, i) =>
  i === 0 ? 'hianime_streams_list.json' : `hianime_streams_list_${i + 1}.json`
);

// HiAnime sub-sources
const HI_SUBSOURCES = [
  { key: 'streamhg',   label: 'StreamHG'   },
  { key: 'earnvids',   label: 'EarnVids'   },
  { key: 'doodstream', label: 'DoodStream' },
  { key: 'vivibebe',   label: 'ViviBebe'   },
  { key: 'bibiemb',    label: 'Bibiemb'    },
];

let currentLang        = 'dub';
let autoNextTimer      = null;
let endWatchInterval   = null;
let serverData         = [];
let hianimeData        = null;
let activeServer       = null;
let activeQuality      = '480';
let _endWatchCleanup   = null;
let preferredServerKey = null;

// Source panel state
let activeSource   = 'anisantch';
let activeHiSubSrc = 'streamhg';

// HiAnime data cache — avoid re-fetching across episode changes
let _hianimeCacheRaw    = null;   // full merged array from all 20 files
let _hianimeLoadPromise = null;   // in-flight fetch promise

// ─────────────────────────────────────────────────────────────────
//  GITHUB PAGES 404 recovery
// ─────────────────────────────────────────────────────────────────
(function recoverRedirect() {
  const p = new URLSearchParams(window.location.search).get('p');
  if (p) window.history.replaceState(null, '', REPO + p);
})();

// ─────────────────────────────────────────────────────────────────
//  URL HELPERS
// ─────────────────────────────────────────────────────────────────
function buildMegaplaySrc(malId, ep, lang) {
  return `https://megaplay.buzz/stream/mal/${malId}/${ep}/${lang}?autostart=true`;
}
function buildPageUrl(malId, ep, lang) {
  return `${REPO}/mal/${malId}/${ep}/${lang}/`;
}

// ─────────────────────────────────────────────────────────────────
//  ANISANTCH SERVER URL BUILDERS
// ─────────────────────────────────────────────────────────────────
const QUALITY_TIERS = [360, 480, 720, 1080];

function getAllanimeUrl(entry, quality) {
  const want  = parseInt(quality, 10);
  const avail = QUALITY_TIERS.filter(q => entry[`allanime_${q}`]);
  if (!avail.length) return null;
  const best  = avail.reduce((a, b) => Math.abs(a - want) <= Math.abs(b - want) ? a : b);
  return entry[`allanime_${best}`] || null;
}

function getAnivibeUrl(entry) { return entry.anivibe || null; }
function getOkcdnUrl(entry)   { return entry.okcdn   || null; }

function getAnicdnUrl(entry) {
  const raw = entry.anicdn_iframe || entry.anicdn;
  if (!raw) return null;
  const m = raw.match(/\/anicdn\/([^/]+)/);
  return m ? `https://as-cdn21.top/video/${m[1]}` : null;
}

function getSwiftUrl(entry) {
  const raw = entry.swift_iframe || entry.swift;
  if (!raw) return null;
  const m = raw.match(/\/swift\/([^/]+)/);
  return m ? `https://argon.razorshell.space/embed/${m[1]}` : null;
}

function buildAnisantchServers(entry) {
  const servers = [];
  if (QUALITY_TIERS.some(q => entry[`allanime_${q}`]))
    servers.push({ key: 'allanime', label: 'AllanimeHD', type: 'multi-quality', entry, source: 'anisantch' });
  const avi = getAnivibeUrl(entry);
  if (avi)  servers.push({ key: 'anivibe', label: 'AniVibe', url: avi, source: 'anisantch' });
  const ok  = getOkcdnUrl(entry);
  if (ok)   servers.push({ key: 'okcdn',   label: 'OkCDN',   url: ok, source: 'anisantch' });
  const cdn = getAnicdnUrl(entry);
  if (cdn)  servers.push({ key: 'anicdn',  label: 'AniCDN',  badge: 'Multi-Lang', url: cdn, source: 'anisantch' });
  const sw  = getSwiftUrl(entry);
  if (sw)   servers.push({ key: 'swift',   label: 'Swift',   badge: 'HI', url: sw, source: 'anisantch' });
  return servers;
}

// ─────────────────────────────────────────────────────────────────
//  HIANIME URL BUILDERS
// ─────────────────────────────────────────────────────────────────
function getHiAnimeUrl(entry, lang, subSrc) {
  const ep = entry.episode_no;
  const prefixes = lang === 'sub' ? [lang, 'hsub'] : [lang];
  for (const prefix of prefixes) {
    const key = `${prefix}_${subSrc}_embed_url_ep_${ep}`;
    if (entry[key]) return entry[key];
  }
  return null;
}

function buildHiAnimeServers(entry, lang) {
  const servers = [];
  for (const ss of HI_SUBSOURCES) {
    const url = getHiAnimeUrl(entry, lang, ss.key);
    if (url) {
      servers.push({
        key:    'hianime_' + ss.key,
        label:  ss.label,
        badge:  'HiAnime',
        url,
        source: 'hianime',
        subsrc: ss.key,
        hiEntry: entry,
        hiLang: lang,
      });
    }
  }
  return servers;
}

// ─────────────────────────────────────────────────────────────────
//  FETCH ANISANTCH JSON
// ─────────────────────────────────────────────────────────────────
async function fetchAnisantchEntry(malId, ep, lang) {
  const key    = `${malId}/${ep}==${lang}`;
  const altKey = `${malId}/${ep}==${lang === 'dub' ? 'sub' : 'dub'}`;
  const results = await Promise.all(
    JSON_FILES.map(f => fetch(JSON_BASE + f).then(r => r.ok ? r.json() : []).catch(() => []))
  );
  const all = results.flat();
  return all.find(e => e.mal_id_with_ep_and_stream_type === key)
      || all.find(e => e.mal_id_with_ep_and_stream_type === altKey)
      || null;
}

// ─────────────────────────────────────────────────────────────────
//  FETCH HIANIME JSON — all 20 files, merged, with caching
// ─────────────────────────────────────────────────────────────────
async function loadHiAnimeRaw() {
  if (_hianimeCacheRaw) return _hianimeCacheRaw;
  if (_hianimeLoadPromise) return _hianimeLoadPromise;

  _hianimeLoadPromise = Promise.all(
    HIANIME_JSON_FILES.map(f =>
      fetch(HIANIME_BASE + f)
        .then(r => r.ok ? r.json() : [])
        .catch(() => [])
    )
  ).then(results => {
    // Flatten all 20 arrays into one merged list
    _hianimeCacheRaw    = results.flat().filter(Boolean);
    _hianimeLoadPromise = null;
    return _hianimeCacheRaw;
  });

  return _hianimeLoadPromise;
}

async function fetchHiAnimeEntry(malId, ep) {
  const all = await loadHiAnimeRaw();
  const mid = parseInt(malId, 10);
  const epn = parseInt(ep, 10);
  return all.find(e => {
    const id = e['mal_id/anilist_id/tmdb_id'];
    return parseInt(id, 10) === mid && parseInt(e.episode_no, 10) === epn;
  }) || null;
}

// ─────────────────────────────────────────────────────────────────
//  UI CONTROLS
// ─────────────────────────────────────────────────────────────────
function toggleBar() {
  const inner = document.getElementById('topbar-inner');
  const btn   = document.getElementById('toggle-bar-btn');
  const open  = inner.classList.toggle('open');
  btn.classList.toggle('open', open);
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
  document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
  const malId = document.getElementById('inp-mal').value.trim();
  const ep    = document.getElementById('inp-ep').value.trim();
  const pf    = document.getElementById('player-iframe');
  if (malId && ep && pf.style.display !== 'none') loadPlayer();
}

function toggleServerPanel() {
  const panel = document.getElementById('server-panel');
  const btn   = document.getElementById('srv-toggle-btn');
  const open  = panel.classList.toggle('visible');
  btn.classList.toggle('open', open);
  if (open) {
    const rect = btn.getBoundingClientRect();
    panel.style.top  = (rect.bottom + 6) + 'px';
    panel.style.left = rect.left + 'px';
  }
}

function switchSource(src) {
  activeSource = src;
  document.getElementById('tab-anisantch').classList.toggle('active', src === 'anisantch');
  document.getElementById('tab-hianime').classList.toggle('active', src === 'hianime');

  const hiSubDiv = document.getElementById('hianime-subsrc');
  const qRow     = document.getElementById('quality-row');

  if (src === 'hianime') {
    hiSubDiv.classList.add('show');
    qRow.style.display = 'none';
    renderHiAnimeServerList();
  } else {
    hiSubDiv.classList.remove('show');
    qRow.style.display = '';
    renderAnisantchServerList();
  }
}

function setHiSubSrc(subsrc) {
  activeHiSubSrc = subsrc;
  document.querySelectorAll('.subsrc-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.subsrc === subsrc);
  });
  renderHiAnimeServerList();
}

// ─────────────────────────────────────────────────────────────────
//  RENDER SERVER PANEL — AnisantCH
// ─────────────────────────────────────────────────────────────────
function renderAnisantchServerList() {
  const qRow    = document.getElementById('quality-row');
  const srvList = document.getElementById('server-list');
  const spLoad  = document.getElementById('sp-loading');
  const spErr   = document.getElementById('sp-error');

  spLoad.style.display = 'none';
  spErr.style.display  = 'none';
  qRow.innerHTML       = '';
  srvList.innerHTML    = '';
  qRow.style.display   = '';

  const servers = serverData;

  if (!servers || !servers.length) {
    spErr.style.display = 'block';
    spErr.textContent   = 'No AnisantCH servers for this episode.';
    return;
  }

  const allanimeEntry = servers.find(s => s.type === 'multi-quality');
  if (allanimeEntry) {
    QUALITY_TIERS.forEach(q => {
      const avail = !!allanimeEntry.entry[`allanime_${q}`];
      const pill  = document.createElement('button');
      pill.className   = 'q-pill' + (q === parseInt(activeQuality) ? ' active' : '') + (avail ? '' : ' unavail');
      pill.textContent = q + 'p';
      if (avail) {
        pill.onclick = () => {
          activeQuality = String(q);
          document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          if (activeServer && activeServer.key === 'allanime') playServer(activeServer);
        };
      }
      qRow.appendChild(pill);
    });
  }

  const preferredIndex = preferredServerKey
    ? servers.findIndex(s => s.key === preferredServerKey && s.source === 'anisantch')
    : -1;
  const defaultIndex = preferredIndex >= 0 ? preferredIndex : 0;

  servers.forEach((srv, i) => {
    const btn = document.createElement('button');
    btn.className   = 'srv-btn' + (i === defaultIndex ? ' active' : '');
    btn.dataset.key = srv.key;

    const nameSpan = document.createElement('span');
    nameSpan.textContent = srv.label;
    btn.appendChild(nameSpan);

    const badgeText = srv.badge || (srv.key === 'allanime' ? 'HD' : '');
    if (badgeText) {
      const badge = document.createElement('span');
      badge.className   = 'srv-badge';
      badge.textContent = badgeText;
      btn.appendChild(badge);
    }

    btn.onclick = () => {
      document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeServer       = srv;
      preferredServerKey = srv.key;
      playServer(srv);
    };

    srvList.appendChild(btn);
    if (i === defaultIndex) activeServer = srv;
  });

  if (servers[defaultIndex]) playServer(servers[defaultIndex]);
}

// ─────────────────────────────────────────────────────────────────
//  RENDER SERVER PANEL — HiAnime
// ─────────────────────────────────────────────────────────────────
function renderHiAnimeServerList() {
  const srvList = document.getElementById('server-list');
  const spLoad  = document.getElementById('sp-loading');
  const spErr   = document.getElementById('sp-error');

  spLoad.style.display = 'none';
  spErr.style.display  = 'none';
  srvList.innerHTML    = '';

  if (!hianimeData) {
    spErr.style.display = 'block';
    spErr.textContent   = 'No HiAnime data for this MAL ID + episode.';
    return;
  }

  const servers = buildHiAnimeServers(hianimeData, currentLang);

  if (!servers.length) {
    spErr.style.display = 'block';
    spErr.textContent   = `No HiAnime ${currentLang.toUpperCase()} streams found for this episode.`;
    return;
  }

  const defaultIndex = Math.max(0, servers.findIndex(s => s.subsrc === activeHiSubSrc));

  servers.forEach((srv, i) => {
    const btn = document.createElement('button');
    btn.className   = 'srv-btn hianime-srv' + (i === defaultIndex ? ' active' : '');
    btn.dataset.key = srv.key;

    const nameSpan = document.createElement('span');
    nameSpan.textContent = srv.label;
    btn.appendChild(nameSpan);

    const hiPill = document.createElement('span');
    hiPill.className   = 'hi-source-pill';
    hiPill.textContent = 'HiAnime';
    btn.appendChild(hiPill);

    btn.onclick = () => {
      document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeServer       = srv;
      preferredServerKey = srv.key;
      activeHiSubSrc = srv.subsrc;
      document.querySelectorAll('.subsrc-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.subsrc === srv.subsrc);
      });
      playServer(srv);
    };

    srvList.appendChild(btn);
    if (i === defaultIndex) activeServer = srv;
  });

  if (servers[defaultIndex]) playServer(servers[defaultIndex]);
}

// ─────────────────────────────────────────────────────────────────
//  PLAY SERVER / LOAD IFRAME
// ─────────────────────────────────────────────────────────────────
let _currentEpisodeCtx = null;

function playServer(srv) {
  let url;
  if (srv.type === 'multi-quality') {
    url = getAllanimeUrl(srv.entry, activeQuality);
    if (!url) {
      for (const q of [480, 720, 360, 1080]) {
        url = srv.entry[`allanime_${q}`];
        if (url) break;
      }
    }
  } else {
    url = srv.url;
  }
  if (!url) return;
  loadIframe(url);
  if (_currentEpisodeCtx) {
    const { malId, ep, lang } = _currentEpisodeCtx;
    const activeFrame = isMegaplayUrl(url)
      ? document.getElementById('player-iframe')
      : document.getElementById('player-iframe-sb');
    watchForEnd(activeFrame, malId, ep, lang);
  }
}

function isMegaplayUrl(url) { return /megaplay\.buzz/i.test(url); }

function loadIframe(url) {
  const plain = document.getElementById('player-iframe');
  const sb    = document.getElementById('player-iframe-sb');
  const ph    = document.getElementById('placeholder');

  stopEndWatch();
  ph.style.display = 'none';

  if (isMegaplayUrl(url)) {
    sb.style.display    = 'none';
    sb.src              = 'about:blank';
    plain.src           = url;
    plain.style.display = 'block';
  } else {
    plain.style.display = 'none';
    plain.src           = 'about:blank';
    sb.src              = url;
    sb.style.display    = 'block';
  }
}

// ─────────────────────────────────────────────────────────────────
//  CORE PLAYER
// ─────────────────────────────────────────────────────────────────
async function showPlayer(src, malId, ep, lang) {
  cancelAutoNext();
  currentLang = lang;
  _currentEpisodeCtx = { malId, ep, lang };

  loadIframe(src);

  document.getElementById('inp-mal').value = malId;
  document.getElementById('inp-ep').value  = ep;
  document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
  document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
  history.replaceState({ malId, ep, lang }, '', buildPageUrl(malId, ep, lang));
  document.title = `MAL ${malId} · Ep ${ep} · ${lang.toUpperCase()}`;

  const srvWrap = document.getElementById('srv-wrap');
  const srvBtn  = document.getElementById('srv-toggle-btn');
  const panel   = document.getElementById('server-panel');
  srvWrap.classList.add('show');
  panel.classList.remove('visible');
  srvBtn.classList.remove('open');

  document.getElementById('quality-row').innerHTML  = '';
  document.getElementById('server-list').innerHTML  = '';
  document.getElementById('sp-loading').style.display = 'flex';
  document.getElementById('sp-error').style.display   = 'none';
  hianimeData = null;
  serverData  = [];

  // Fetch both sources in parallel
  const [anisantchEntry, hiEntry] = await Promise.all([
    fetchAnisantchEntry(malId, ep, lang).catch(() => null),
    fetchHiAnimeEntry(malId, ep).catch(() => null),
  ]);

  document.getElementById('sp-loading').style.display = 'none';

  if (anisantchEntry) serverData = buildAnisantchServers(anisantchEntry);
  hianimeData = hiEntry || null;

  updateSourceTabAvailability();

  if (activeSource === 'hianime') {
    renderHiAnimeServerList();
  } else {
    renderAnisantchServerList();
  }

  // Auto-switch to HiAnime if AnisantCH has nothing
  if (!serverData.length && hianimeData && activeSource === 'anisantch') {
    switchSource('hianime');
  }
}

function updateSourceTabAvailability() {
  document.getElementById('tab-anisantch').style.opacity = serverData.length ? '1' : '0.4';
  document.getElementById('tab-hianime').style.opacity   = hianimeData        ? '1' : '0.4';
}

function loadPlayer() {
  const malId = document.getElementById('inp-mal').value.trim();
  const ep    = document.getElementById('inp-ep').value.trim();
  if (!malId || !ep) { alert('Please enter both a MAL ID and an episode number.'); return; }
  showPlayer(buildMegaplaySrc(malId, ep, currentLang), malId, ep, currentLang);
}

// ─────────────────────────────────────────────────────────────────
//  PREV / NEXT
// ─────────────────────────────────────────────────────────────────
function goPrevEp() {
  const malId = document.getElementById('inp-mal').value.trim();
  const ep    = parseInt(document.getElementById('inp-ep').value.trim(), 10);
  if (!malId || isNaN(ep) || ep <= 1) return;
  showPlayer(buildMegaplaySrc(malId, ep - 1, currentLang), malId, ep - 1, currentLang);
}

function goNextEp() {
  const malId = document.getElementById('inp-mal').value.trim();
  const ep    = parseInt(document.getElementById('inp-ep').value.trim(), 10);
  if (!malId || isNaN(ep)) return;
  showPlayer(buildMegaplaySrc(malId, ep + 1, currentLang), malId, ep + 1, currentLang);
}

// ─────────────────────────────────────────────────────────────────
//  END-OF-EPISODE DETECTION
// ─────────────────────────────────────────────────────────────────
function stopEndWatch() {
  clearInterval(endWatchInterval);
  endWatchInterval = null;
  if (_endWatchCleanup) { _endWatchCleanup(); _endWatchCleanup = null; }
}

function watchForEnd(iframe, malId, ep, lang) {
  stopEndWatch();
  let active = true;

  function onMessage(e) {
    if (!active) return;
    const d = e.data;
    if (!d) return;
    const str = typeof d === 'string' ? d : JSON.stringify(d);
    if (/ended|complete|finish|event.*end/i.test(str)) { cleanup(); triggerAutoNext(malId, ep, lang); }
  }
  window.addEventListener('message', onMessage);

  let settled = false;
  const settleTimer = setTimeout(() => { settled = true; }, 1500);

  endWatchInterval = setInterval(() => {
    if (!active || !settled) return;
    try {
      const s = iframe.src || '';
      if (s === '' || s === 'about:blank') { cleanup(); triggerAutoNext(malId, ep, lang); }
    } catch(_) {}
  }, 2000);

  function cleanup() {
    active = false;
    clearTimeout(settleTimer);
    clearInterval(endWatchInterval);
    endWatchInterval = null;
    window.removeEventListener('message', onMessage);
    _endWatchCleanup = null;
  }
  _endWatchCleanup = cleanup;
}

// ─────────────────────────────────────────────────────────────────
//  AUTO-NEXT
// ─────────────────────────────────────────────────────────────────
function triggerAutoNext(malId, ep, lang) {
  if (!document.getElementById('chk-autonext').checked) return;
  const nextEp = parseInt(ep, 10) + 1;
  document.getElementById('an-ep-label').textContent = `Episode ${nextEp}`;
  const overlay = document.getElementById('autonext-overlay');
  const bar     = document.getElementById('an-bar');
  overlay.style.display = 'block';
  bar.style.transition  = 'none';
  bar.style.transform   = 'scaleX(1)';
  bar.getBoundingClientRect();
  bar.style.transition  = `transform ${COUNTDOWN_S}s linear`;
  bar.style.transform   = 'scaleX(0)';
  let remaining = COUNTDOWN_S;
  autoNextTimer = setInterval(() => { if (--remaining <= 0) goNextNow(); }, 1000);
}

function goNextNow() {
  cancelAutoNext();
  const malId = document.getElementById('inp-mal').value.trim();
  const ep    = parseInt(document.getElementById('inp-ep').value.trim(), 10);
  if (!malId || isNaN(ep)) return;
  showPlayer(buildMegaplaySrc(malId, ep + 1, currentLang), malId, ep + 1, currentLang);
}

function cancelAutoNext() {
  clearInterval(autoNextTimer);
  autoNextTimer = null;
  const overlay = document.getElementById('autonext-overlay');
  if (overlay) overlay.style.display = 'none';
  stopEndWatch();
}

// ─────────────────────────────────────────────────────────────────
//  URL PARSER on load
// ─────────────────────────────────────────────────────────────────
(function parseUrl() {
  const m = window.location.pathname.match(/\/mal\/(\d+)\/(\d+)(?:\/(dub|sub))?(?:\/)?$/i);
  if (m) {
    const malId = m[1], ep = m[2];
    const lang  = (m[3] || 'dub').toLowerCase() === 'sub' ? 'sub' : 'dub';
    showPlayer(buildMegaplaySrc(malId, ep, lang), malId, ep, lang);
  }
})();
